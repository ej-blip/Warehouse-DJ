<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <!-- Each iPad's link carries its secret; never send it to other sites. -->
  <meta name="referrer" content="no-referrer">
  <!-- Added to the Home Screen, this opens full screen with the iPad's own link (no manifest,
       so iOS keeps the ?t= token in the saved address). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Warehouse DJ">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="icon" type="image/png" href="/img/icon-180.png">
  <title>Warehouse DJ</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Warehouse <span>DJ</span></div>
    <div class="who"><span id="device-name"></span><span class="dot" id="conn-dot" title="Live updates"></span></div>
  </header>

  <div id="not-set-up" class="center-screen" hidden>
    <h1>This iPad isn't set up yet</h1>
    <p>Ask an admin to add it on the admin page, then open the link they give you on this iPad.</p>
  </div>

  <main class="wrap" id="app" hidden>
    <div class="banners" id="banners"></div>
    <div class="grid player">
      <div class="col col-left">
        <section class="card" aria-labelledby="now-h">
          <h2 id="now-h">Now playing</h2>
          <div id="now"></div>
        </section>
        <section class="card" aria-labelledby="next-h">
          <h2 id="next-h">Up next</h2>
          <div id="up-next"></div>
        </section>
      </div>
      <div class="col">
        <section class="card" aria-labelledby="search-h">
          <h2 id="search-h">Add a song</h2>
          <div id="quota" class="quota"></div>
          <form class="search" id="search-form" role="search">
            <input id="search-input" type="search" placeholder="Search songs or artists" autocomplete="off"
                   autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search songs or artists">
            <button class="btn" type="button" id="search-clear" hidden>Clear</button>
          </form>
          <ul class="list" id="results"></ul>
          <button class="btn more" id="more" hidden>Show more</button>
        </section>
        <section class="card" aria-labelledby="recent-h">
          <h2 id="recent-h">Recently played</h2>
          <ul class="list" id="recent"></ul>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">Song info and artwork from Spotify.</footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
